steps:
  - name: actual-budget
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: registry.bzd.gg
      username: { from_secret: zot_registry_user }
      password: { from_secret: zot_registry_password }
      repo: registry.bzd.gg/bzd/actual-budget-mcp
      dockerfile: servers/actual-budget/Dockerfile
      context: servers/actual-budget
      platforms: linux/amd64,linux/arm64
      provenance: false
      tags: [latest, "sha-${CI_COMMIT_SHA}"]
    when:
      - event: [push, manual]
        branch: master
        path: { include: ["servers/actual-budget/**", ".woodpecker/**"] }
      - event: tag
        ref: refs/tags/actual-budget-v*

  - name: woodpecker
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: registry.bzd.gg
      username: { from_secret: zot_registry_user }
      password: { from_secret: zot_registry_password }
      repo: registry.bzd.gg/bzd/woodpecker-mcp
      dockerfile: servers/woodpecker/Dockerfile
      context: servers/woodpecker
      platforms: linux/amd64,linux/arm64
      provenance: false
      tags: [latest, "sha-${CI_COMMIT_SHA}"]
    when:
      - event: [push, manual]
        branch: master
        path: { include: ["servers/woodpecker/**", ".woodpecker/**"] }
      - event: tag
        ref: refs/tags/woodpecker-v*

  - name: faster-whisper
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: registry.bzd.gg
      username: { from_secret: zot_registry_user }
      password: { from_secret: zot_registry_password }
      repo: registry.bzd.gg/bzd/faster-whisper-mcp
      dockerfile: servers/faster-whisper/Dockerfile
      context: servers/faster-whisper
      platforms: linux/amd64,linux/arm64
      provenance: false
      tags: [latest, "sha-${CI_COMMIT_SHA}"]
    when:
      - event: [push, manual]
        branch: master
        path: { include: ["servers/faster-whisper/**", ".woodpecker/**"] }
      - event: tag
        ref: refs/tags/faster-whisper-v*
