      password:
        from_secret: pulp_registry_password
      dockerfile: servers/faster-whisper/Dockerfile
      context: servers/faster-whisper
      platforms: linux/arm64
      provenance: false
      cache_images:
        - registry.bzd.gg/bzd/faster-whisper-mcp:buildcache-arm64
      tags:
        - sha-${CI_COMMIT_SHA}-arm64
    when:
      - event: tag
        ref: refs/tags/faster-whisper-v*
