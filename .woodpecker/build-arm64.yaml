labels:
  platform: linux/arm64

steps:
  - name: publish-branch-arm64
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.bzd.gg/bzd/actual-budget-mcp
      registry: registry.bzd.gg
      username:
        from_secret: pulp_registry_user
      password:
        from_secret: pulp_registry_password
      dockerfile: servers/actual-budget/Dockerfile
      context: servers/actual-budget
      platforms: linux/arm64
      provenance: false
      cache_images:
        - registry.bzd.gg/bzd/actual-budget-mcp:buildcache-arm64
      tags:
        - sha-${CI_COMMIT_SHA}-arm64
    when:
      - event: [push, manual]
        branch: master
        path:
          include:
            - servers/actual-budget/**
            - .woodpecker/**

  - name: publish-tag-arm64
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.bzd.gg/bzd/actual-budget-mcp
      registry: registry.bzd.gg
      username:
        from_secret: pulp_registry_user
      password:
        from_secret: pulp_registry_password
      dockerfile: servers/actual-budget/Dockerfile
      context: servers/actual-budget
      platforms: linux/arm64
      provenance: false
      cache_images:
        - registry.bzd.gg/bzd/actual-budget-mcp:buildcache-arm64
      tags:
        - sha-${CI_COMMIT_SHA}-arm64
    when:
      - event: tag
        ref: refs/tags/actual-budget-v*

  - name: publish-branch-arm64-woodpecker
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.bzd.gg/bzd/woodpecker-mcp
      registry: registry.bzd.gg
      username:
        from_secret: pulp_registry_user
      password:
        from_secret: pulp_registry_password
      dockerfile: servers/woodpecker/Dockerfile
      context: servers/woodpecker
      platforms: linux/arm64
      provenance: false
      cache_images:
        - registry.bzd.gg/bzd/woodpecker-mcp:buildcache-arm64
      tags:
        - sha-${CI_COMMIT_SHA}-arm64
    when:
      - event: [push, manual]
        branch: master
        path:
          include:
            - servers/woodpecker/**
            - .woodpecker/**

  - name: publish-tag-arm64-woodpecker
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.bzd.gg/bzd/woodpecker-mcp
      registry: registry.bzd.gg
      username:
        from_secret: pulp_registry_user
      password:
        from_secret: pulp_registry_password
      dockerfile: servers/woodpecker/Dockerfile
      context: servers/woodpecker
      platforms: linux/arm64
      provenance: false
      cache_images:
        - registry.bzd.gg/bzd/woodpecker-mcp:buildcache-arm64
      tags:
        - sha-${CI_COMMIT_SHA}-arm64
    when:
      - event: tag
        ref: refs/tags/woodpecker-v*

  - name: publish-branch-arm64-faster-whisper
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.bzd.gg/bzd/faster-whisper-mcp
      registry: registry.bzd.gg
      username:
        from_secret: pulp_registry_user
      password:
        from_secret: pulp_registry_password
      dockerfile: servers/faster-whisper/Dockerfile
      context: servers/faster-whisper
      platforms: linux/arm64
      provenance: false
      cache_images:
        - registry.bzd.gg/bzd/faster-whisper-mcp:buildcache-arm64
      tags:
        - sha-${CI_COMMIT_SHA}-arm64
    when:
      - event: [push, manual]
        branch: master
        path:
          include:
            - servers/faster-whisper/**
            - .woodpecker/**

  - name: publish-tag-arm64-faster-whisper
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.bzd.gg/bzd/faster-whisper-mcp
      registry: registry.bzd.gg
      username:
