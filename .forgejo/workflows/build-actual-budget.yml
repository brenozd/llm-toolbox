name: Build actual-budget-mcp

on:
  push:
    branches:
      - main
    paths:
      - servers/actual-budget/**
      - .forgejo/workflows/build-actual-budget.yml
    tags:
      - 'actual-budget-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: [self-hosted, amd64]
          - platform: linux/arm64
            runs-on: [self-hosted, arm64]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Install dependencies
        run: apk add --no-cache nodejs docker-cli docker-cli-buildx

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: git.bzd.gg
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Clean stale buildkit image cache
        # Guards against a corrupted containerd content store (manifest present,
        # blob missing — happens after an interrupted pull or GC race on the
        # self-hosted runner). Forces a fresh pull instead of failing bootstrap.
        run: docker rmi -f moby/buildkit:buildx-stable-1 || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: servers/actual-budget
          file: servers/actual-budget/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=git.bzd.gg/bzd/actual-budget-mcp,push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          arch=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${arch}

      - name: Upload digest
        uses: actions/upload-artifact@v3
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/
          if-no-files-found: error

  merge:
    needs: build
    runs-on: [self-hosted, amd64]
    steps:
      - name: Install dependencies
        run: apk add --no-cache nodejs docker-cli docker-cli-buildx

      - name: Log in to Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: git.bzd.gg
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Download amd64 digest
        uses: actions/download-artifact@v3
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v3
        with:
          name: digest-arm64
          path: /tmp/digests

      - name: Create and push manifest
        run: |
          TAGS="-t git.bzd.gg/bzd/actual-budget-mcp:latest -t git.bzd.gg/bzd/actual-budget-mcp:sha-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#actual-budget-}"
            TAGS="$TAGS -t git.bzd.gg/bzd/actual-budget-mcp:$VERSION"
          fi
          docker buildx imagetools create \
            $TAGS \
            $(cat /tmp/digests/linux-amd64) \
            $(cat /tmp/digests/linux-arm64)
