repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        exclude: ^docs/reference/  # the reference video
      - id: check-toml
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    - id: codespell
      args: [-L, "actualpy,meu,te,oficial,erro,fo,nd,handel,anull,anullsrc,fase,fases,comando,dito,expresso", -S, "docs/storyboard-video-*.md"]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.2
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: release-sync
        name: link MCP/skill/plugin versions (bump + derive)
        entry: scripts/release.py sync
        language: script
        pass_filenames: false
        always_run: true
      - id: sync-agent-tools
        name: sync agent tools (Pi + Claude Code names)
        entry: scripts/sync-agent-tools.py
        language: script
        files: ^agents/.*\.md$
        pass_filenames: false
