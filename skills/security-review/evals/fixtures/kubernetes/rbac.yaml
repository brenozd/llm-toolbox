apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: billing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-cluster-admin
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: billing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # SEEDED: the deployer ServiceAccount is cluster-admin, so a leaked token owns the cluster.
  name: cluster-admin
