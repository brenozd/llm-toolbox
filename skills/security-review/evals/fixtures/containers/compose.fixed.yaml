# Fixed twin of ../compose.yaml: no socket, credential injected from the host environment.
# Same hardened shape as the seed, so the only difference is the two seeded flaws.
services:
  app:
    image: billing-api:1.4.0@sha256:1f8a3c6e9b2d47f05a8c1e3b6d9f2a4c7e0b3d6f9a2c5e8b1d4f7a0c3e6b9d2f
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    environment:
      BILLING_API_TOKEN: ${BILLING_API_TOKEN:?set in the host environment}
      LOG_LEVEL: info
    tmpfs:
      - /tmp
    privileged: false
  db:
    image: postgres:16.2@sha256:a3b5c7d9e1f20468b2d4f6a8c0e214365d7f9a1c3e5b7d9f0a2c4e6b8d0f2a4c
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
volumes:
  db-data:
