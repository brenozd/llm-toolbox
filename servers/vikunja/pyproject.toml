[project]
name = "vikunja-mcp"
version = "0.1.0"
description = "MCP server for Vikunja projects, tasks, comments and labels."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
]

[project.scripts]
vikunja-mcp = "vikunja_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vikunja_mcp*"]
