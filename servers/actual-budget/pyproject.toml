[project]
name = "actual-budget-mcp"
version = "0.5.0"
description = "MCP server exposing Actual Budget (actualbudget.org) accounts, transactions, categories, and budgets."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "actualpy>=0.22.0",
]

[project.scripts]
actual-budget-mcp = "actual_budget_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["actual_budget_mcp*"]
