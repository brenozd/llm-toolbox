[project]
name = "whatsapp-mcp"
version = "0.2.0"
description = "MCP server exposing WhatsApp chats and messages (read-only by default) through an in-process whatsmeow client."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "neonize==0.10.0",
    "segno>=1.6",
]

[project.scripts]
whatsapp-mcp = "whatsapp_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whatsapp_mcp*"]
