[project]
name = "promo-video-mcp"
version = "0.1.0"
description = "MCP server that turns a repo (web, CLI, GUI) into an honest promo video: scan, capture, validate spec, render, verify."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "playwright==1.64.1",
]

[project.scripts]
promo-video-mcp = "promo_video_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promo_video_mcp*"]
