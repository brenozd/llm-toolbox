[project]
name = "woodpecker-mcp"
version = "0.1.0"
description = "MCP server exposing Woodpecker CI/CD orgs, repos, pipelines, secrets, and registries."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
]

[project.scripts]
woodpecker-mcp = "woodpecker_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["woodpecker_mcp*"]
