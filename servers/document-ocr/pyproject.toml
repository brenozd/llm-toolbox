[project]
name = "document-ocr-mcp"
version = "0.1.0"
description = "MCP server that reads text from images and PDFs (text layer first, Tesseract OCR otherwise)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "pypdfium2>=4.30,<6",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
document-ocr-mcp = "document_ocr_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["document_ocr_mcp*"]
