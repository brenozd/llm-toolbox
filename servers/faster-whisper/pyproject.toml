[project]
name = "faster-whisper-mcp"
version = "0.1.0"
description = "MCP server exposing speech-to-text transcription via faster-whisper."
requires-python = ">=3.11"
# Both pins are load-bearing:
#  - av<19: faster-whisper 1.2.1 calls av.open(..., metadata_errors="ignore") and PyAV 19 removed
#    that kwarg, so every transcribe() dies with "unexpected keyword argument 'metadata_errors'".
#    The ceiling lifts once a faster-whisper release with the fix (PR #1495) ships.
#  - faster-whisper>=1.2.1,<1.3: keep the known-good 1.2.x line whose av usage matches the pin above.
dependencies = [
    "mcp>=1.9.0,<2",
    "faster-whisper>=1.2.1,<1.3",
    "av>=11,<19",
]

[project.optional-dependencies]
# Only needed to run tests/test_contract.py outside the distroless image (no Python tooling there).
test = ["pytest>=8"]

[project.scripts]
faster-whisper-mcp = "faster_whisper_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faster_whisper_mcp*"]
