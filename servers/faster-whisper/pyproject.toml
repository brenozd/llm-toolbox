[project]
name = "faster-whisper-mcp"
version = "0.3.0"
description = "MCP server exposing speech-to-text transcription via Parakeet (transcribe-cpp)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "transcribe-cpp==0.2.3",  # ggml engine + bundled native lib; 0.x API, keep pinned
    "huggingface_hub",
    "numpy",
    "av>=11",
]

[project.optional-dependencies]
# Only needed to run tests/test_contract.py outside the distroless image (no Python tooling there).
test = ["pytest>=8"]

[project.scripts]
faster-whisper-mcp = "faster_whisper_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faster_whisper_mcp*"]
